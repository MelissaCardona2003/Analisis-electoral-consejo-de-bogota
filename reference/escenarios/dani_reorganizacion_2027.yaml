# Traducción de la hipótesis completa de Dani (texto recibido íntegro) — este es su "escenario de
# reorganización de coaliciones". Ver también dani_base_2027.yaml y dani_fragmentacion_2027.yaml.
# Un humano debe revisar y ajustar los números antes de tratarlos como algo más que una ilustración.
id: dani_reorganizacion_2027
nombre: "Reorganización de coaliciones (hipótesis de Dani)"
descripcion: >
  Escenario de reorganización de coaliciones: Centro Democrático y Salvación Nacional actúan
  coordinadamente en vez de competir por separado (Dani pide explícitamente comparar un "escenario de
  alianza" contra uno "de división" para estas dos fuerzas — este archivo modela la alianza; el
  escenario de división ya es, de hecho, el comportamiento por defecto del modelo, porque ahí Centro
  Democrático y Salvación Nacional siempre se tratan como familias separadas). Algunos sectores del
  centro se agrupan alrededor de una candidatura común, en vez de fragmentarse en varias listas
  nuevas: se modela como un solo movimiento nuevo, más chico que el de Claudia López del escenario de
  fragmentación. Alianza Verde conserva una parte mayor de su estructura que en el escenario de alta
  fragmentación. El Pacto Histórico sigue siendo relevante pero enfrenta una competencia más
  concentrada (no se le da el mismo impulso que en el escenario de fragmentación). Los números de
  abajo son ILUSTRATIVOS, no una medición, y deben ajustarse con Dani antes de tratarlos como una
  apuesta informada.
fuente: "hipótesis completa de Dani, secciones 7 (Centro Democrático y Salvación Nacional) y 10 (Escenario de reorganización de coaliciones); texto recibido íntegro"

# De lo que le queda a Alianza Verde DESPUÉS de la candidatura común de centro (ver `desde` más abajo,
# no aquí: ahí se define cuánto de Verde se va a esa lista nueva, para no restar el mismo voto dos veces).
transferencia:
  alianza_verde:
    alianza_verde: 0.6875  # conserva más estructura que en el escenario de fragmentación
    pacto_historico: 0.125
    otros: 0.1875
multiplicadores:
  centro_democratico: 1.15      # absorbe la votación de la alianza con Salvación Nacional
  salvacion_nacional: 0.55      # actúa coordinadamente: no presenta una candidatura fuerte propia
  pacto_historico: 1.05         # relevante pero con competencia más concentrada (menos impulso que en fragmentación)

listas_nuevas:
  - id: candidatura_comun_centro
    nombre: "Candidatura común de centro"
    cuota_prior: {media: 0.05, sd_log: 0.45}  # un solo movimiento, no varios: más chico que el de López en fragmentación
    desde: {alianza_verde: 0.55, nuevo_liberalismo: 0.30, otros: 0.15}
    familia_mostrar: otros
